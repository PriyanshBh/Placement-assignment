services:
  mongodb:
    image: mongo:7
    container_name: policy-pulse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - policy-pulse-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 4s
      retries: 10

volumes:
  policy-pulse-data:
